<div class="login-wrapper">
    <div class="login-holder">
        <form class="login-form" (ngSubmit)="onSubmit()">
            <div class="login-title">Login</div>
            <div class="login-credentials">
                <div class="login-credentials-input">
                    <input autofocus name="username" [(ngModel)]="username" placeholder="Username" required type="text">
                </div>
                <div class="login-credentials-icon">
                    <span class="material-symbols-rounded">person</span>
                </div>
                <div class="clearfix"></div>
            </div>

            <div class="login-credentials">
                <div class="login-credentials-input">
                    <input name="password" [(ngModel)]="password" placeholder="Password" required type="password">
                </div>
                <div class="login-credentials-icon">
                    <span class="material-symbols-rounded">lock</span>
                </div>
                <div class="clearfix"></div>
            </div>

            <div class="login-credentials">
                <div class="login-credentials-input">
                    <input id="rememberMe" name="rememberMe" [(ngModel)]="rememberMe" type="checkbox">
                    <label for="rememberMe">Remember me</label>
                </div>
                <div class="clearfix"></div>
            </div>
            @if (errorMessage) {{{ errorMessage }}}
            <div class="login-credentials">
                <div class="login-credentials-input full-width">
                    <button type="submit" [disabled]="isLoading">{{ isLoading ? 'Logging in...' : 'Login' }}</button>
                </div>
                <div class="clearfix"></div>
            </div>
        </form>
    </div>

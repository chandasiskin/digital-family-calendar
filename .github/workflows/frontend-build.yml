name: Frontend-build

on:
  push:
    paths:
      - frontend/**
  pull_request:
    paths:
      - frontend/**

defaults:
  run:
    working-directory: ./frontend

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node JS
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Clean install
      run: npm ci

    - name: Build
      run: npx ng build

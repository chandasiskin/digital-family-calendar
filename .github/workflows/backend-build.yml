name: Backend-build

on:
  push:
    paths:
      - backend/**
  pull_request:
    paths:
      - backend/**

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: Clean install
      working-directory: ./backend
      run: |
        npm ci

    - name: Build
      working-directory: ./backend
      run: npm start --if-present
    
    - name: Tests
      working-directory: ./backend
      run: npm run test
